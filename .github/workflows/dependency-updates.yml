name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # Job 1: Update Node.js dependencies
  update-node-dependencies:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: |
          npx npm-check-updates -u
          npm install

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update Node.js dependencies'
          branch: chore/update-node-dependencies
          delete-branch: true
          title: 'chore: Update Node.js Dependencies'
          body: |
            ## Node.js Dependencies Update

            This PR updates Node.js dependencies to their latest versions.

            ### Changes
            - Updated packages in package.json
            - Updated package-lock.json

            ### Testing
            - [ ] All tests pass
            - [ ] No breaking changes detected
            - [ ] Manual testing completed

            **Auto-generated by GitHub Actions**
          labels: |
            dependencies
            automated
          assignees: iamgerwin

  # Job 2: Update Ruby dependencies
  update-ruby-dependencies:
    name: Update Ruby Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: false
          working-directory: apps/api

      - name: Update dependencies
        working-directory: apps/api
        run: |
          bundle update --conservative
          bundle clean

      - name: Run tests
        working-directory: apps/api
        env:
          RAILS_ENV: test
          DATABASE_URL: sqlite3::memory:
        run: bundle exec rspec
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update Ruby dependencies'
          branch: chore/update-ruby-dependencies
          delete-branch: true
          title: 'chore: Update Ruby Dependencies'
          body: |
            ## Ruby Dependencies Update

            This PR updates Ruby gem dependencies to their latest compatible versions.

            ### Changes
            - Updated gems in Gemfile.lock

            ### Testing
            - [ ] All RSpec tests pass
            - [ ] No security vulnerabilities
            - [ ] Manual testing completed

            **Auto-generated by GitHub Actions**
          labels: |
            dependencies
            automated
          assignees: iamgerwin

  # Job 3: Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
          working-directory: apps/api

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate
          npm audit fix --dry-run
        continue-on-error: true

      - name: Run bundle audit
        working-directory: apps/api
        run: |
          gem install bundler-audit
          bundle audit --update
        continue-on-error: true

      - name: Create security issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security vulnerabilities detected',
              body: 'Automated security scan detected vulnerabilities. Please review and update dependencies.',
              labels: ['security', 'dependencies']
            })
